# Configuración para Nimbus Alpha (en 127.0.0.1)
server {
    listen 80;
    server_name nimbus-alpha.local;

    location / {
        proxy_pass http://apache-backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Configuración para Nimbus Beta (en 127.0.0.2)
server {
    listen 127.0.0.2:80;
    server_name nimbus-beta.local;

    location / {
        proxy_pass http://apache-backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}